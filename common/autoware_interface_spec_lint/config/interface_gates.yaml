# Interface-spec gate config for the OSS component-interface-versioning first wave.
#
# Each gate maps to a severity: off (not run), warn (advisory), error (fails the
# build when it reports at least one finding). M2.1 ratchets the manifest / honesty
# / isolation gates from warn to error. `ament_interface_spec_lint --config <this>`
# loads it; `--warn-only` overrides every gate to exit 0 for local advisory runs.
gates:
  # Static header analyses (no false positives on the registered surface).
  interface_spec_concept: { severity: error }
  spec_registered: { severity: error }
  version_consistency: { severity: error }
  qos_consistency: { severity: error }

  # Manifest freshness. The lint check binds only where the M0.1 generator is
  # available and skips gracefully otherwise (plain checkout / pre-commit); the
  # BINDING freshness gate is the specs-package gtest (test/test_manifest.cpp),
  # which regenerates and asserts byte-equality on every build-and-test CI run.
  manifest_fresh: { severity: error }

  # Cross-cutting honesty / isolation audits over the committed manifest(s).
  owner_isolation: { severity: error }
  no_raw_spec_topic: { severity: error }

  # --- Honest deferrals (kept off; enabling one is rejected until implemented) ---
  # ("off" is quoted so YAML does not parse the bare word as the boolean false.)
  # Need per-component provided/required role manifests, which arrive with the
  # deploy-time track (OCI-label manifests, M2.2). Deferred.
  no_foreign_if_dependency: { severity: "off" }
  # profile_compat = the X2 vendor profile; out of OSS first-wave enforce scope
  # (design section 8, parent doc P3). Deferred.
  profile_compat: { severity: "off" }
  # Runtime gates defer to the Stage-2 runtime re-analysis (2026-07-01
  # re-sequencing): they bring up a profile and inspect broadcast/admission.
  if_usage_coverage: { severity: "off" }
  admission_smoke: { severity: "off" }

# Heavy-raw confinement deny list (design section 5). A versioned topic whose
# interface name contains any deny substring must not be a cross-container spec.
# The derived grid /sensing/obstacle_segmentation/obstacle_grid is NOT raw and
# does not match. Request/response services are out of scope (see checks.py).
no_raw_spec_topic:
  deny:
    - /pointcloud
    # Both spellings: the ROS topic is /map/pointcloud_map, but the spec declares
    # PointCloudMap::name = "/map/point_cloud_map", and the gate matches the
    # spec-declared interface name that reaches the manifest.
    - pointcloud_map
    - point_cloud_map
    - /image_raw
    - occupancy_grid_map/map
    - concatenated/pointcloud
  allow: []

# owner_isolation: extension (vendor) manifests may not shadow a base-owner
# interface name. Vacuously clean with the single autowarefoundation core manifest;
# binds once a vendor-partition manifest is cross-checked (vendor-partition wave).
owner_isolation:
  base_owner: autowarefoundation
